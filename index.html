<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=office/">
  <title>KXD</title>
  <style>body{font-family:system-ui,sans-serif;background:#14111c;color:#ece9f5;display:grid;place-items:center;height:100vh;margin:0}a{color:#c4b5fd}</style>
</head>
<body>
  <p>Weiter zu <a href="office/">KXD Office</a> …</p>
  <script>
    // Frueher lag KXD Office hier an der Wurzel. Dessen Offline-Speicher (Bereich „/“) wieder abmelden,
    // damit er Heft, Glas und Organizer nicht mit erfasst.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((liste) => Promise.all(
        liste.filter((r) => new URL(r.scope).pathname === '/').map((r) => r.unregister())
      )).finally(() => location.replace('office/'));
    } else location.replace('office/');
  </script>
</body>
</html>
